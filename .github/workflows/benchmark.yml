name: Benchmark Chord AI

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo do benchmark"
        required: true
        default: "normal"
        type: choice
        options:
          - normal
          - strict
          - salvar-baseline

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v4


      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          package-manager-cache: false


      - name: Mostrar versões
        run: |
          echo "=== NODE ==="
          node --version

          echo ""
          echo "=== NPM ==="
          npm --version


      - name: Instalar dependências
        run: npm install


      - name: Conferir estrutura do projeto
        run: |
          echo "=============================="
          echo "RAIZ DO PROJETO"
          echo "=============================="

          ls -lah

          echo ""
          echo "=============================="
          echo "PASTA BENCHMARKS"
          echo "=============================="

          if [ ! -d benchmarks ]; then
            echo "ERRO: pasta benchmarks não existe."
            exit 1
          fi

          ls -lah benchmarks


      - name: Conferir arquivos WAV
        run: |
          echo "=============================="
          echo "TIPO DOS WAVS"
          echo "=============================="

          file benchmarks/benchmark-a.wav
          file benchmarks/benchmark-b.wav

          echo ""
          echo "=============================="
          echo "TAMANHOS"
          echo "=============================="

          wc -c benchmarks/benchmark-a.wav
          wc -c benchmarks/benchmark-b.wav

          echo ""
          echo "=============================="
          echo "PRIMEIROS 16 BYTES"
          echo "=============================="

          echo "Benchmark A:"
          od -An -tx1 -N16 benchmarks/benchmark-a.wav

          echo ""
          echo "Benchmark B:"
          od -An -tx1 -N16 benchmarks/benchmark-b.wav


      - name: Validar cabeçalho WAV
        run: |
          node <<'NODE'

          const fs = require("fs");

          const files = [
            "benchmarks/benchmark-a.wav",
            "benchmarks/benchmark-b.wav"
          ];

          let failed = false;

          for (const file of files) {

            console.log("");
            console.log("Validando:", file);

            if (!fs.existsSync(file)) {
              console.error("ERRO: arquivo não existe.");
              failed = true;
              continue;
            }

            const buffer =
              fs.readFileSync(file);

            console.log(
              "Tamanho:",
              buffer.length,
              "bytes"
            );

            if (buffer.length < 44) {
              console.error(
                "ERRO: WAV possui menos de 44 bytes."
              );

              failed = true;
              continue;
            }

            const riff =
              buffer
                .subarray(0,4)
                .toString("ascii");

            const wave =
              buffer
                .subarray(8,12)
                .toString("ascii");

            console.log(
              "RIFF:",
              JSON.stringify(riff)
            );

            console.log(
              "WAVE:",
              JSON.stringify(wave)
            );

            if (
              riff !== "RIFF"
              ||
              wave !== "WAVE"
            ) {

              console.error(
                "ERRO: arquivo não possui cabeçalho WAV RIFF válido."
              );

              failed = true;

              continue;
            }

            console.log(
              "Cabeçalho WAV válido."
            );
          }

          if (failed) {
            process.exit(1);
          }

          console.log("");
          console.log(
            "Todos os WAVs passaram na validação."
          );

          NODE


      - name: Conferir cases.json
        run: |
          echo "=============================="
          echo "CASES.JSON"
          echo "=============================="

          if [ ! -f benchmarks/cases.json ]; then
            echo "ERRO: benchmarks/cases.json não existe."
            exit 1
          fi

          cat benchmarks/cases.json


      - name: Aguardar API do Render
        run: |
          echo "=============================="
          echo "VERIFICANDO CHORD AI"
          echo "=============================="

          for i in {1..30}; do

            if curl -fsS https://chord-ai-api.onrender.com/health > /dev/null; then

              echo ""
              echo "API online."

              curl -fsS https://chord-ai-api.onrender.com/health

              echo ""

              exit 0

            fi

            echo "Tentativa $i/30..."

            sleep 5

          done

          echo ""
          echo "ERRO: API não respondeu dentro do tempo limite."

          exit 1


      - name: Rodar benchmark normal
        if: ${{ inputs.modo == 'normal' }}
        env:
          BENCHMARK_API_URL: https://chord-ai-api.onrender.com
        run: npm run benchmark


      - name: Rodar benchmark strict
        if: ${{ inputs.modo == 'strict' }}
        env:
          BENCHMARK_API_URL: https://chord-ai-api.onrender.com
        run: npm run benchmark:strict


      - name: Criar baseline
        if: ${{ inputs.modo == 'salvar-baseline' }}
        env:
          BENCHMARK_API_URL: https://chord-ai-api.onrender.com
        run: npm run benchmark:save


      - name: Mostrar último resultado
        if: always()
        run: |
          echo "=============================="
          echo "ÚLTIMO RESULTADO"
          echo "=============================="

          if [ -f benchmarks/last-result.json ]; then

            cat benchmarks/last-result.json

          else

            echo "last-result.json não foi criado."

          fi


      - name: Mostrar baseline
        if: always()
        run: |
          echo "=============================="
          echo "BASELINE"
          echo "=============================="

          if [ -f benchmarks/baseline.json ]; then

            cat benchmarks/baseline.json

          else

            echo "baseline.json ainda não existe."

          fi


      - name: Salvar relatório como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chord-ai-benchmark
          path: |
            benchmarks/last-result.json
            benchmarks/baseline.json
          if-no-files-found: ignore
