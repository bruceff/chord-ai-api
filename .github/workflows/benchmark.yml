name: Benchmark Chord AI

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo do benchmark"
        required: true
        default: "normal"
        type: choice
        options:
          - normal
          - strict
          - salvar-baseline

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v4


      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Mostrar versão do Node e npm
        run: |
          node --version
          npm --version


      - name: Instalar dependências
        run: npm install


      - name: Conferir arquivos de benchmark
        run: |
          echo "Raiz do projeto:"
          ls -lah

          echo ""
          echo "Pasta benchmarks:"
          ls -lah benchmarks

          echo ""
          echo "Arquivo cases.json:"
          cat benchmarks/cases.json


      - name: Aguardar API do Render
        run: |
          echo "Verificando Chord AI no Render..."

          for i in {1..30}; do

            if curl -fsS https://chord-ai-api.onrender.com/health > /dev/null; then
              echo "API online."
              exit 0
            fi

            echo "Tentativa $i/30..."
            sleep 5

          done

          echo "A API não respondeu dentro do tempo limite."
          exit 1


      - name: Rodar benchmark normal
        if: ${{ inputs.modo == 'normal' }}
        env:
          BENCHMARK_API_URL: https://chord-ai-api.onrender.com
        run: npm run benchmark


      - name: Rodar benchmark strict
        if: ${{ inputs.modo == 'strict' }}
        env:
          BENCHMARK_API_URL: https://chord-ai-api.onrender.com
        run: npm run benchmark:strict


      - name: Criar baseline
        if: ${{ inputs.modo == 'salvar-baseline' }}
        env:
          BENCHMARK_API_URL: https://chord-ai-api.onrender.com
        run: npm run benchmark:save


      - name: Mostrar último resultado
        if: always()
        run: |
          echo "================================="
          echo "Último resultado do benchmark"
          echo "================================="

          if [ -f benchmarks/last-result.json ]; then
            cat benchmarks/last-result.json
          else
            echo "last-result.json não foi criado."
          fi


      - name: Mostrar baseline
        if: always()
        run: |
          echo "================================="
          echo "Baseline"
          echo "================================="

          if [ -f benchmarks/baseline.json ]; then
            cat benchmarks/baseline.json
          else
            echo "baseline.json ainda não existe."
          fi


      - name: Salvar relatório como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chord-ai-benchmark
          path: |
            benchmarks/last-result.json
            benchmarks/baseline.json
          if-no-files-found: ignore
